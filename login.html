<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Skill Square</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="Images/logo.png">

    <!-- Bootstrap -->
    <link rel="stylesheet" href="bootstrap/bootstrap.min.css?v=1.2">

    <!-- Font Awesome (Local) -->
    <link rel="stylesheet" href="fontawesome/css/all.min.css?v=1.2">

    <!-- CSS -->

    <link rel="stylesheet" href="CSS/style.css?v=2.4">

</head>

<body>

    <section class="login-section">

        <div class="container">

            <div class="row login-box align-items-center">

                <!-- LEFT SIDE -->

                <div class="col-lg-6 login-left">

                    <h1>Skill Square</h1>

                    <p>
                        Learn skills for your future career
                        with industry level training.
                    </p>

                </div>

                <!-- RIGHT SIDE -->

                <div class="col-lg-6 login-right">

                    <h2>Welcome Back</h2>

                    <p>Login to continue learning</p>
                    <form id="loginForm">

                        <div class="input-wrapper-premium" style="position: relative; width: 100%; margin-bottom: 20px;">
                            <input type="email" id="loginEmail" placeholder="Enter Email" style="margin-bottom: 0 !important; padding-right: 45px !important;">
                            <i class="far fa-envelope toggle-field" style="pointer-events: none; opacity: 0.85;" title="Email Address"></i>
                        </div>

                        <div class="input-wrapper-premium" style="position: relative; width: 100%; margin-bottom: 20px;">
                            <input type="password" id="loginPassword" placeholder="Enter Password" style="margin-bottom: 0 !important; padding-right: 45px !important;" maxlength="8" pattern="[a-zA-Z0-9]{8}" title="Password must be exactly 8 characters long and contain only letters and numbers (alphanumeric).">
                            <i class="far fa-eye toggle-field" id="toggleLoginPassword" title="Toggle Password Visibility"></i>
                        </div>
                        <div class="forgot-text-container text-end mb-3" style="margin-top: -10px; margin-bottom: 20px;">
                            <a href="forgot-password.html" class="forgot-link" style="color: gold; text-decoration: none; font-size: 14px; font-weight: 500; transition: color 0.3s;" onmouseover="this.style.color='white'" onmouseout="this.style.color='gold'">Forgot Password?</a>
                        </div>
                        <button class="login-btn">

                            Login

                        </button>

                    </form>
                    <p class="register-text">

                        Don't have an account?

                        <a href="register.html">
                            Register
                        </a>

                    </p>



                </div>

            </div>

        </div>

    </section>
    <script src="javascript/login.js"></script>

</body>

</html>
