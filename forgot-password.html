<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - Skill Square</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="Images/logo.png">

    <!-- Bootstrap -->
    <link rel="stylesheet" href="bootstrap/bootstrap.min.css?v=1.2">

    <!-- Font Awesome (Local) -->
    <link rel="stylesheet" href="fontawesome/css/all.min.css?v=1.2">

    <!-- CSS -->

    <link rel="stylesheet" href="CSS/style.css?v=2.4">

</head>

<body>

    <section class="login-section">

        <div class="container">

            <div class="row login-box align-items-center">

                <!-- LEFT SIDE -->

                <div class="col-lg-6 login-left">

                    <h1>Skill Square</h1>

                    <p>
                        Reset your password easily. Enter your registered email and phone number to verify your identity and set a new password.
                    </p>

                </div>

                <!-- RIGHT SIDE -->

                <div class="col-lg-6 login-right">

                    <h2>Reset Password</h2>

                    <p>Provide registered details below</p>
                    <form id="forgotPasswordForm">

                        <input type="email" id="forgotEmail" placeholder="Enter Registered Email" required>

                        <input type="text" id="forgotPhone" placeholder="Enter Registered Phone Number" required>

                        <input type="password" id="forgotPassword" placeholder="Enter New Password (min 6 chars)" required>

                        <input type="password" id="forgotConfirmPassword" placeholder="Confirm New Password" required>

                        <button class="login-btn mt-2" type="submit">

                            Reset Password

                        </button>

                    </form>
                    <p class="register-text">

                        Remembered your password?

                        <a href="login.html">
                            Login Here
                        </a>

                    </p>

                </div>

            </div>

        </div>

    </section>
    <script src="javascript/forgot-password.js"></script>

</body>

</html>
