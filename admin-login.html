<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Skill Square</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="Images/logo.png">

    <!-- Bootstrap -->
    <link rel="stylesheet" href="bootstrap/bootstrap.min.css?v=1.2">

    <!-- Font Awesome (Local) -->
    <link rel="stylesheet" href="fontawesome/css/all.min.css?v=1.2">

    <!-- CSS -->

    <link rel="stylesheet" href="CSS/style.css?v=2.5">

</head>

<body>

    <section class="login-section">

        <div class="container">

            <div class="row login-box align-items-center">

                <!-- LEFT SIDE -->

                <div class="col-lg-6 login-left">

                    <h1>Skill Square</h1>

                    <p>
                        Admin Portal - Manage students, courses,
                        and system parameters.
                    </p>

                </div>

                <!-- RIGHT SIDE -->

                <div class="col-lg-6 login-right">

                    <h2>Admin Login</h2>

                    <p>Enter administrative credentials</p>
                    <form id="adminLoginForm">

                        <input type="email" id="adminEmail" placeholder="Enter Admin Email" required>

                        <input type="password" id="adminPassword" placeholder="Enter Admin Password" required>

                        <button type="submit" class="login-btn">

                            Login As Admin

                        </button>

                    </form>

                    <p class="register-text">

                        Are you a student?

                        <a href="login.html">
                            Student Login
                        </a>

                    </p>

                </div>

            </div>

        </div>

    </section>
    <script src="javascript/admin.js"></script>

</body>

</html>
