<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Skill Square</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="Images/logo.png">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="bootstrap/bootstrap.min.css">

    <!-- Font Awesome (Local) -->
    <link rel="stylesheet" href="fontawesome/css/all.min.css?v=2.2">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="CSS/style.css?v=2.3">

</head>

<body>

    <section class="login-section">

        <div class="container">

            <div class="row login-box align-items-center">

                <!-- LEFT SIDE -->

                <div class="col-lg-6 login-left">

                    <h1>Skill Square</h1>

                    <p>
                        Start your learning journey
                        with industry level courses.
                    </p>

                </div>

                <!-- RIGHT SIDE -->

                <div class="col-lg-6 login-right">


                    <h2>Create Account</h2>


                    <form id="registerForm">

                        <input type="text" id="name" placeholder="Enter Name">

                        <div class="input-wrapper-premium" style="position: relative; width: 100%; margin-bottom: 20px;">
                            <input type="email" id="email" placeholder="Enter Email" style="margin-bottom: 0 !important; padding-right: 45px !important;">
                            <i class="far fa-eye toggle-field" id="toggleRegisterEmail" title="Toggle Email Visibility"></i>
                        </div>

                        <input type="text" id="phone" placeholder="Enter Phone">

                        <input type="text" id="location" placeholder="Enter Location">

                        <div class="input-wrapper-premium" style="position: relative; width: 100%; margin-bottom: 20px;">
                            <input type="password" id="password" placeholder="Enter Password" style="margin-bottom: 0 !important; padding-right: 45px !important;" maxlength="8" pattern="[a-zA-Z0-9]{8}" title="Password must be exactly 8 characters long and contain only letters and numbers (alphanumeric).">
                            <i class="far fa-eye toggle-field" id="toggleRegisterPassword" title="Toggle Password Visibility"></i>
                        </div>

                        <button type="submit" class="register-btn">

                            Register

                        </button>

                    </form>



                    <p class="register-text">

                        Already have an account?

                        <a href="login.html">
                            Login
                        </a>

                    </p>

                </div>

            </div>

        </div>

    </section>
    <script src="javascript/script.js?v=2.3"></script>
    <script src="javascript/register.js"></script>

</body>

</html>
