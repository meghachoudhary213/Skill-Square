<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Profile</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="Images/logo.png">

    <!-- Bootstrap -->

    <link rel="stylesheet" href="bootstrap/bootstrap.min.css">

    <!-- Font Awesome (Local) -->
    <link rel="stylesheet" href="fontawesome/css/all.min.css?v=1.2">

    <!-- CSS -->

    <link rel="stylesheet" href="CSS/style.css?v=2.6">

</head>

<body>

    <!-- Mobile Top Header -->
    <div class="mobile-top-header">
        <h2>Skill Square</h2>
        <span class="mobile-user-greet">Hello! ðŸ‘‹</span>
    </div>

    <div class="dashboard-container">

        <!-- SIDEBAR -->
        <div class="sidebar">
            <h2 class="logo">Skill Square</h2>
            <ul>
                <li>
                    <a href="dashboard.html">
                        <i class="fa-solid fa-house"></i> Dashboard
                    </a>
                </li>
                <li>
                    <a href="courses.html">
                        <i class="fa-solid fa-book"></i> Courses
                    </a>
                </li>
                <li class="active-menu">
                    <i class="fa-solid fa-user"></i> Profile
                </li>
                <li>
                    <a href="certificate.html">
                        <i class="fa-solid fa-award"></i> Certificates
                    </a>
                </li>
                <li>
                    <a href="index.html">
                        <i class="fa-solid fa-right-from-bracket"></i> Logout
                    </a>
                </li>
            </ul>
        </div>

        <!-- MAIN CONTENT -->
        <div class="main-content">
            <div class="top-bar">
                <h1>My Profile</h1>
            </div>

            <section class="profile-page py-0">
                <div class="container p-0">

            <div class="profile-box">

                <!-- PROFILE IMAGE -->

                <div class="profile-image" id="profileImageWrapper" style="position: relative; cursor: pointer; width: 150px; height: 150px; margin: 0 auto 25px auto;">

                    <div style="width: 100%; height: 100%; border-radius: 50%; overflow: hidden; border: 3px solid var(--luxury-gold); box-shadow: 0 0 20px rgba(255, 215, 0, 0.2); position: relative;">
                        <img id="userProfileImg" src="Images/user.jpg" style="width: 100%; height: 100%; object-fit: cover; display: block;">
                        
                        <div class="profile-image-overlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.65); display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; opacity: 0; transition: all 0.3s ease; font-size: 13px; font-weight: 600; border-radius: 50%;">
                            <i class="fa-solid fa-camera" style="font-size: 22px; margin-bottom: 5px; color: gold;"></i>
                            <span>Upload Photo</span>
                        </div>
                    </div>

                    <!-- Floating Pen Edit Badge -->
                    <div class="profile-edit-badge" style="position: absolute; bottom: 5px; right: 5px; background: var(--gold-gradient); color: black; width: 34px; height: 34px; border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5); border: 2px solid #050505; z-index: 5; transition: all 0.3s ease;">
                        <i class="fa-solid fa-pen" style="font-size: 13px;"></i>
                    </div>
                    
                    <input type="file" id="profileImageInput" accept="image/*" style="display: none;" />

                </div>

                <!-- PROFILE DETAILS -->

                <div class="profile-details">

                    <h1 id="profileName">



                    </h1>

                    <div class="profile-info">

                        <div class="info-item">

                            <i class="fa-solid fa-envelope"></i>

                            <span id="profileEmail">

                            </span>

                        </div>

                        <div class="info-item">

                            <i class="fa-solid fa-phone"></i>

                            <span id="profilePhone">
                            </span>

                        </div>

                        <div class="info-item">

                            <i class="fa-solid fa-location-dot"></i>

                            <span id="profileLocation">

                            </span>
                        </div>

                    </div>

                    <!-- COURSE PROGRESS -->

                    <div class="progress-section">

                        <h3>

                            Course Progress

                        </h3>

                        <div class="progress mb-4">

                            <div class="progress-bar bg-warning" style="width:75%">

                                75%

                            </div>

                        </div>

                    </div>

                    <!-- BUTTONS -->

                    <div class="profile-buttons">

                        <a href="courses.html">

                            <button>

                                My Courses

                            </button>

                        </a>

                        <a href="certificate.html">

                            <button>

                                Certificates

                            </button>

                        </a>

                    </div>

                </div>

            </div>

        </div>
            </section>

        </div>

    </div>

    <script>
        document.getElementById("profileName").innerText = localStorage.getItem("userName");
        document.getElementById("profileEmail").innerText = localStorage.getItem("userEmail");
        document.getElementById("profilePhone").innerText = localStorage.getItem("userPhone");
        document.getElementById("profileLocation").innerText = localStorage.getItem("userLocation");

        // Profile Picture Upload Handler
        const storedImage = localStorage.getItem("userProfileImage");
        const imgElement = document.getElementById("userProfileImg");
        if (storedImage && imgElement) {
            imgElement.src = storedImage;
        }

        const imageWrapper = document.getElementById("profileImageWrapper");
        const imageInput = document.getElementById("profileImageInput");

        if (imageWrapper && imageInput && imgElement) {
            imageWrapper.addEventListener("click", () => {
                imageInput.click();
            });

            // Custom mouse events for overlay hover visual stability
            const overlay = imageWrapper.querySelector(".profile-image-overlay");
            imageWrapper.addEventListener("mouseenter", () => {
                overlay.style.opacity = "1";
                const badge = imageWrapper.querySelector(".profile-edit-badge");
                if (badge) {
                    badge.style.transform = "scale(1.12)";
                    badge.style.boxShadow = "0 6px 15px rgba(255, 215, 0, 0.3)";
                }
            });
            imageWrapper.addEventListener("mouseleave", () => {
                overlay.style.opacity = "0";
                const badge = imageWrapper.querySelector(".profile-edit-badge");
                if (badge) {
                    badge.style.transform = "scale(1)";
                    badge.style.boxShadow = "0 4px 10px rgba(0,0,0,0.5)";
                }
            });

            imageInput.addEventListener("change", (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        imgElement.src = event.target.result;
                        localStorage.setItem("userProfileImage", event.target.result);
                        alert("Success! Your profile picture has been updated.");
                    };
                    reader.readAsDataURL(file);
                }
            });
        }
    </script>

    <!-- Mobile Bottom Navigation -->
    <div class="mobile-bottom-nav">
        <a href="dashboard.html" class="mobile-bottom-nav-item">
            <i class="fa-solid fa-house"></i>
            <span>Dashboard</span>
        </a>
        <a href="courses.html" class="mobile-bottom-nav-item">
            <i class="fa-solid fa-book"></i>
            <span>Courses</span>
        </a>
        <a href="profile.html" class="mobile-bottom-nav-item active">
            <i class="fa-solid fa-user"></i>
            <span>Profile</span>
        </a>
        <a href="certificate.html" class="mobile-bottom-nav-item">
            <i class="fa-solid fa-award"></i>
            <span>Certificates</span>
        </a>
        <a href="index.html" class="mobile-bottom-nav-item">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>Logout</span>
        </a>
    </div>

    <!-- Script for Authentication and Session Handling -->
    <script src="javascript/auth-guard.js"></script>
    <script src="javascript/chatbot.js?v=3.5"></script>
</body>

</html>
